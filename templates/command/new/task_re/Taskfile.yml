# https://taskfile.dev

version: '3'

dotenv: ['task.env']

vars:
{% raw %}
  PID: 
    sh: "echo $(adb shell pidof {{.PACKAGE}})"
  FRIDA_SCRIPTS: "/{{.HOME}}/workspace/frida-scripts/src/frida_scripts/js/"
  LLDBBITES: "/{{.HOME}}/l"
  FRIDABITES: "/{{.HOME}}/f"
  ITRACE_AGENT: "/{{.HOME}}/venvs/re/lib/python3.11/site-packages/frida_tools/itracer_agent.js"

tasks:
  status:
    cmds:
      - adb shell su -c 'cat /proc/$(pidof {{.PACKAGE}})/status'

  wchan:
    cmds:
      - adb shell su -c 'cat /proc/$(pidof {{.PACKAGE}})/wchan'

  echo-pids:
    cmds:
      - echo {{.PID}}

  fds:
    cmds:
      - adb shell su -c 'ls -al /proc/$(pidof {{.PACKAGE}})/fd/'

  trace:
    cmds:
      - source re && my-frida-ai --no-auto-reload -U -l {{.FRIDA_SCRIPTS}}/trace.js -l {{.FRIDABITES}}/trace/{{.T}}.js -f {{.PACKAGE}}

  dbg:
    cmds:
      - "/{{.LLDBBITES}}/lldb-ndk-app-attach.sh {{.PACKAGE}} -s {{.LLDBBITES}}/bitescripts/base.lldb"

  trace-attach:
    cmds:
      - source re && my-frida-ai --no-auto-reload -U -l {{.FRIDA_SCRIPTS}}/trace.js -l {{.FRIDABITES}}/trace/{{.T}}.js -p {{.PID}}


  itrace:
    cmds:
      - source re && my-frida --runtime v8 --no-auto-reload -U  -l {{.ITRACE_AGENT}} -l {{.FRIDA_SCRIPTS}}/trace.js -l {{.FRIDABITES}}/traca/{{.T}}.js -f {{.PACKAGE}}

  fi:
    cmds:
      - source re && my-frida --no-auto-reload -U -l {{.FRIDA_SCRIPTS}}/trace.js -f {{.PACKAGE}}

  fl:
    cmds:
      - source re && my-frida --no-auto-reload -U -f {{.PACKAGE}} -l {{.FRIDABITES}}/trace/{{.T}}.js

  fr:
    cmds:
      - source re && my-frida --no-auto-reload -U -f {{.PACKAGE}} -l {{.T}}

  fr-spawn:
    cmds:
      - source re && my-frida --no-auto-reload -U -f {{.PACKAGE}}

  fr-attach:
    cmds:
      - source re && my-frida-ai --no-auto-reload -U -p {{.PID}}

  features:
    cmds:
      - adb shell pm list features

  ps:
    cmds:
      - source re && frida-ps -U

  ps2:
    cmds:
      - adb shell 'su -c "ps -A"'

  list-packages:
    cmds:
      - adb shell pm list packages

  package-path:
    cmds:
      - adb shell pm path {{.PACKAGE}}

  download-apks:
    dir: apks/
    cmds:
      - for pkg in $(adb shell pm path {{.PACKAGE}}); do adb pull $(echo $pkg | cut -c 9-); done

  decompile:
    cmds:
      - source re && mass-java-decompile -s apks/ -d java/

  lsof:
    cmds:
      - adb shell 'su -c "lsof -p {{.PID}}"'

  maps:
    cmds:
      - adb shell 'su -c "cat /proc/{{.PID}}/maps"'
{% endraw %}
