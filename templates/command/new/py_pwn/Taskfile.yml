# https://taskfile.dev

version: '3'

vars:
  PWN: "~/venvs/pwn/bin/activate"
  NAME: {{name}}

tasks:
  patch-ld:
    cmds:
      - patchelf --set-interpreter ./ld-linux-x86-64.so.2 ./{{name}}

  run:
    cmds:
      - LD_LIBRARY_PATH=./ ./{{name}}

{% if host is defined and port is defined -%}
  run-remote:
    cmds:
      - nc {{host}} {{port}}
{%- endif %}

{% raw %}
  dbg:
    cmds:
      - source {{.PWN}} && ./{{.NAME}}-solution.py GDB

  local:
    cmds:
      - source {{.PWN}} && ./{{.NAME}}-solution.py

  remote:
    cmds:
      - source {{.PWN}} && ./{{.NAME}}-solution.py REMOTE
{% endraw %}
